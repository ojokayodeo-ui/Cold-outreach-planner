[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command   = "npm run build"
  publish   = ".next"

# Extend function timeout for long-running AI API calls.
# Free tier max is 10s; Pro allows up to 26s; Enterprise allows higher.
# All API routes have been optimised to complete within ~30s.
[functions."___netlify-server-handler"]
  timeout = 26

# Explicitly route all Next.js server-rendered paths to the function.
# Required because the server handler's export const config path routing
# is sometimes not picked up when a .json manifest is also present.
[[redirects]]
  from   = "/_next/data/*"
  to     = "/.netlify/functions/___netlify-server-handler"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/___netlify-server-handler"
  status = 200
  force  = true

